[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xlingual-consistency"
version = "0.1.0"
description = "Measure whether an LLM gives the same answer in English, Russian, Ukrainian and Slovak"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Maksym Arikh", email = "maxarikh@gmail.com" }]
keywords = ["llm", "evaluation", "multilingual", "ai-safety", "benchmark"]
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
xlc = "xlingual.cli:main"

[project.urls]
Repository = "https://github.com/LiKeT128/xlingual-consistency"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
